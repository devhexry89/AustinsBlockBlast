
name: Build Austins BlockBlast (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify game engine
        run: bash ./scripts/test-engine.sh

      - name: Build iPhone app
        run: |
          xcodebuild \
            -project AustinsBlockBlast.xcodeproj \
            -scheme AustinsBlockBlast \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/AustinsBlockBlast.app Payload/
          zip -qry AustinsBlockBlast-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AustinsBlockBlast-unsigned-IPA
          path: AustinsBlockBlast-unsigned.ipa
          if-no-files-found: error
